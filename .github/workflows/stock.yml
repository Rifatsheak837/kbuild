name: stock-gki-build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Deps
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          sudo apt-get update
          sudo apt-get install -y git flex bison build-essential zip curl libssl-dev libelf-dev bc cpio rsync lz4 xz-utils unzip python3
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o ~/repo && chmod +x ~/repo
      - name: Swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - name: Sync
        run: |
          mkdir ~/k && cd ~/k
          ~/repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-2024-05 --depth=1 --no-tags
          mkdir -p .repo/local_manifests
          echo '<manifest><remove-project name="kernel/common"/><project path="common" name="kernel/common" remote="aosp" revision="7c6bbcca33e1734642601acf07a14140116fa956" upstream="refs/heads/deprecated/android12-5.10-2024-05"/></manifest>' > .repo/local_manifests/fix.xml
          ~/repo sync -c -j4 --no-tags --no-clone-bundle
          cd common
          git fetch --depth=1 $(git remote | head -1) 7c6bbcca33e1734642601acf07a14140116fa956 || git fetch --depth=1 $(git remote | head -1) refs/heads/deprecated/android12-5.10-2024-05
          git checkout -f 7c6bbcca33e1734642601acf07a14140116fa956
          # Pin the exact kernel version suffix seen in the phone's /proc/version.
          # scripts/setlocalversion cats .scmversion verbatim, so describe is skipped.
          printf '%s' '-android12-9-00016-g7c6bbcca33e1' > .scmversion
          echo "scmversion: $(cat .scmversion)"
          grep -rn 'scmversion' ../build/ 2>/dev/null | head -10 || true
          grep -rn BUILD_NUMBER ../build/*.sh | head -5 || true
          grep -rn 'BUILD_NUMBER' ../build/ Makefile scripts/setlocalversion build.config* 2>/dev/null | head -20 || true
          git log -1 --format='%H %cd'
          ls -d ../prebuilts*/clang/host/linux-x86/clang-r* || true
          grep -h CLANG_VERSION ../common/build.config.* || true
      - name: Build
        run: |
          cd ~/k
          BUILD_NUMBER=12029497 BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh
      - name: Check
        run: |
          echo "scmversion after build: $(cat ~/k/common/.scmversion 2>/dev/null || echo MISSING)"
          cd ~/k/out/*/dist
          cp ../common/.config built_config.txt
          strings -a Image | grep -E '^Linux version 5|5\.10\.209-android12' | head -3 || echo "VERSION STRING NOT FOUND"
          echo "--- kernel.release: $(cat ../common/include/config/kernel.release)"
          grep UTS_RELEASE ../common/include/generated/utsrelease.h || true
          env | grep -iE 'BUILD_NUMBER|LOCALVERSION' || echo "no BUILD_NUMBER/LOCALVERSION in env"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: stock-kernel
          path: |
            ~/k/out/*/dist/Image*
            ~/k/out/*/dist/System.map
            ~/k/out/*/dist/built_config.txt
            ~/k/out/*/dist/vmlinux.symvers
